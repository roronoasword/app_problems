import heapq

def optimize_container_routes(yard_graph, start_bay, destination_cranes):
    """Calcula la ruta óptima de menor congestión para camiones de transferencia."""
    distances = {node: float('inf') for node in yard_graph}
    distances[start_bay] = 0
    pq = [(0, start_bay)]
    
    while pq:
        cost, curr = heapq.heappop(pq)
        if cost > distances[curr]:
            continue
        for neighbor, weight in yard_graph.get(curr, []):
            if cost + weight < distances[neighbor]:
                distances[neighbor] = cost + weight
                heapq.heappush(pq, (cost + weight, neighbor))
                
    return {c: distances[c] for c in destination_cranes if c in distances}

function detectAnomalies(transactions, threshold = 2.5) {
  const amounts = transactions.map(t => t.amount);
  const avg = amounts.reduce((a, b) => a + b, 0) / amounts.length;
  const stdDev = Math.sqrt(amounts.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / amounts.length);

  return transactions.map(tx => {
    const zScore = Math.abs((tx.amount - avg) / (stdDev || 1));
    return {
      id: tx.id,
      amount: tx.amount,
      zScore: zScore.toFixed(2),
      isFraud: zScore > threshold || tx.amount > 30000
    };
  });

def step(road, vmax=3):
    n = len(road)
    res = [-1]*n
    for i in range(n):
        v = road[i]
        if v != -1:
            dist = 1
            while dist <= vmax and road[(i+dist)%n] == -1: dist += 1
            v = min(v + 1, vmax, dist - 1)

      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto p-4 rounded-xl border shadow-xl flex items-start gap-3 backdrop-blur-md transition-all duration-200 animate-in fade-in slide-in-from-bottom-2 ${
        type === 'success' ? 'bg-[#0F1E19] border-emerald-500/40 text-emerald-300' :
        type === 'error' ? 'bg-[#1F1015] border-rose-500/40 text-rose-300' :
        'bg-[#161224] border-purple-500/40 text-purple-300'
      }`;

      toast.innerHTML = `
        <div class="flex-1">
          <h4 class="text-xs font-bold text-white uppercase tracking-wider">${title}</h4>
          <p class="text-xs text-gray-300 mt-0.5 leading-relaxed">${message}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-white text-xs p-1">✕</button>
      `;

      container.appendChild(toast);
      setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
    }

    function bindAuthEvents() {
      let isRegistering = false;
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const fieldName = document.getElementById('field-name');
      const authForm = document.getElementById('auth-form');
      const authError = document.getElementById('auth-error');
      const btnSubmit = document.getElementById('btn-auth-submit');
      const btnTogglePass = document.getElementById('btn-toggle-pass');
      const inputPass = document.getElementById('input-password');
      const btnQuick = document.getElementById('btn-quick-login');

      // Botón entrada rápida
      btnQuick.onclick = () => {
        const user = state.registeredUsers.find(u => u.username.toLowerCase() === 'angelo2008') || DEFAULT_USERS[0];
        state.currentUser = user;
        setCurrentSession(user);
        showToast('success', '¡Bienvenido, Angelo2008!', 'Has ingresado con las credenciales por defecto.');
        renderApp();
      };

      // Toggle mostrar contraseña
      btnTogglePass.onclick = () => {
        if (inputPass.type === 'password') {
          inputPass.type = 'text';
          btnTogglePass.textContent = 'Ocultar';
        } else {
          inputPass.type = 'password';
          btnTogglePass.textContent = 'Mostrar';
        }
      };

      // Switch tab
      tabLogin.onclick = () => {
        isRegistering = false;
        tabLogin.className = 'py-1.5 rounded-md bg-purple-600 text-white font-semibold shadow';
        tabRegister.className = 'py-1.5 rounded-md text-gray-400 hover:text-white';
        fieldName.classList.add('hidden');
        btnSubmit.textContent = 'Acceder a la Plataforma';
        authError.classList.add('hidden');
      };

      tabRegister.onclick = () => {
        isRegistering = true;
        tabRegister.className = 'py-1.5 rounded-md bg-purple-600 text-white font-semibold shadow';
        tabLogin.className = 'py-1.5 rounded-md text-gray-400 hover:text-white';
        fieldName.classList.remove('hidden');
        btnSubmit.textContent = 'Crear Cuenta y Comenzar';
        authError.classList.add('hidden');
      };

      authForm.onsubmit = (e) => {
        e.preventDefault();
        const username = document.getElementById('input-username').value.trim();
        const password = document.getElementById('input-password').value.trim();
        const name = document.getElementById('input-name').value.trim();

        if (isRegistering) {
          const exists = state.registeredUsers.some(u => u.username.toLowerCase() === username.toLowerCase());
          if (exists) {
            authError.textContent = 'El usuario ya existe. Elija otro nombre.';
            authError.classList.remove('hidden');
            return;
          }
          const newUser = { username, password, displayName: name || username };
          state.registeredUsers.push(newUser);
          saveRegisteredUsers(state.registeredUsers);
          state.currentUser = newUser;
          setCurrentSession(newUser);
          showToast('success', 'Registro Exitoso', `Bienvenido/a, ${newUser.username}`);
          renderApp();
        } else {
          const found = state.registeredUsers.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);
          if (found || (username.toLowerCase() === 'angelo2008' && password === 'Sago2008')) {
            const user = found || DEFAULT_USERS[0];
            state.currentUser = user;
            setCurrentSession(user);
            showToast('success', `¡Bienvenido, ${user.displayName || user.username}!`, 'Sesión iniciada con éxito.');
            renderApp();
          } else {
            authError.textContent = 'Usuario o contraseña incorrectos. Utilice Angelo2008 / Sago2008';
            authError.classList.remove('hidden');
          }
        }
      };
    }

                      <div class="text-xs font-code">
                        <span class="text-gray-500 block text-[10px] uppercase">Recompensa</span>
                        <span class="text-emerald-400 font-bold">$${ch ? ch.reward.toLocaleString('en-US') : 0} USD</span>
                      </div>

                      <!-- BOTÓN DIRECTO OBLIGATORIO: Ver Código / Entrar a tu GitHub -->
                      <button onclick="openRepoViewer('${sol.id}')" class="px-3.5 py-2 text-xs font-bold text-white bg-purple-600 hover:bg-purple-500 rounded-lg shadow-md shadow-purple-900/40 flex items-center gap-1.5 transition-colors">
                        <span>🐙 Ver Código / Entrar a tu GitHub</span>

                `;

            </div>
          `}
        </div>
      `;
    }

    // ==========================================
    // 9. BOTÓN 3: 🚀 EXPLORAR PROBLEMAS (13 RETOS)
    // ==========================================
    function renderExploreChallenges() {
      const userSolutions = state.solutions.filter(s => s.username.toLowerCase() === state.currentUser.username.toLowerCase());

            <div>
              <div class="text-xs font-semibold uppercase tracking-wider text-purple-400 mb-1">
                🚀 Catálogo de Innovación Abierta
              </div>
              <h1 class="text-xl sm:text-2xl font-bold text-white">Explora los 13 Problemas Empresariales</h1>
              <p class="text-xs sm:text-sm text-gray-400 mt-1 max-w-xl">
                Al enviar una solución con tu código, se moverá automáticamente a <strong>"Mis Soluciones"</strong> y creará un repositorio interactivo.
              </p>
            </div>
            <div class="text-xs text-gray-400 bg-[#0D1117] px-4 py-2 rounded-xl border border-[#30363D] font-code">

            <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">

                  <div>
                    <div class="flex items-center justify-between text-xs text-gray-400 mb-2">
                      <span class="font-code font-bold text-purple-400">#${ch.number}</span>
                      <span class="font-semibold text-gray-300 truncate">${ch.company}</span>
                      <span class="text-purple-400">${ch.industry}</span>
                    </div>

                    <h3 class="text-base font-bold text-white mb-2 leading-snug">${ch.title}</h3>
                    <p class="text-xs text-gray-300 line-clamp-3 leading-relaxed mb-4">${ch.summary}</p>

                    <div class="flex flex-wrap gap-1.5 mb-4">
                      ${ch.tags.map(t => `<span class="text-[10px] font-code px-2 py-0.5 rounded bg-[#0D1117] text-gray-300 border border-[#30363D]">${t}</span>`).join('')}
                    </div>
                  </div>

                  <div class="pt-4 border-t border-[#30363D]">
                    <div class="flex items-baseline justify-between mb-3">
                      <div>
                        <span class="text-[10px] text-gray-500 uppercase font-code">Recompensa</span>
                        <div class="text-xl font-code font-bold text-emerald-400">$${ch.reward.toLocaleString('en-US')} USD</div>
                      </div>
                      <span class="text-xs font-code text-gray-400">${ch.deadline}</span>
                    </div>

                    ${hasSubmitted ? `
                      <button onclick="switchTab('mis-soluciones')" class="w-full py-2 px-3 text-xs font-semibold text-purple-300 bg-purple-950/60 border border-purple-500/40 rounded-lg hover:bg-purple-900/60 transition-colors">
                        ✓ Solución Enviada (Ver en Mis Soluciones)

                      <button onclick="openSubmitModal('${ch.id}')" class="w-full py-2.5 px-3 text-xs font-bold text-white bg-purple-600 hover:bg-purple-500 rounded-lg shadow-md shadow-purple-900/40 transition-colors">

    function renderSubmitModal() {

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/85 backdrop-blur-md overflow-y-auto">
          <div class="relative w-full max-w-3xl bg-[#0D1117] border border-[#30363D] rounded-xl shadow-2xl p-6 sm:p-8 my-4 text-gray-100">
            <div class="flex items-start justify-between pb-4 border-b border-[#30363D]">
              <div>
                <span class="text-xs text-purple-400 font-semibold font-code block">RETO #${ch.number} · ${ch.company}</span>
                <h2 class="text-lg sm:text-xl font-bold text-white mt-0.5">${ch.title}</h2>
                <span class="text-xs text-emerald-400 font-code font-bold">Recompensa: $${ch.reward.toLocaleString('en-US')} USD</span>
              </div>
              <button onclick="closeModal()" class="text-gray-400 hover:text-white text-sm p-1">✕</button>
            </div>

            <form id="solution-form" class="mt-4 space-y-4">
              <!-- Botón rápido Hola Mundo -->
              <div class="flex items-center justify-between bg-[#161B22] p-2.5 rounded-lg border border-[#30363D] text-xs">
                <span class="text-gray-300">¿Quieres probar rápidamente?</span>
                <button type="button" onclick="loadHelloWorldTemplate()" class="px-2.5 py-1 text-xs font-bold text-purple-300 bg-purple-950/60 border border-purple-500/40 rounded hover:bg-purple-900">

              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-medium text-gray-300 mb-1">Nombre del Repositorio</label>
                  <input type="text" id="sol-repo" required value="${state.currentUser.username.toLowerCase()}/solucion-${ch.id}" class="w-full px-3 py-2 bg-[#090D16] border border-[#30363D] rounded-lg text-xs font-code text-white focus:outline-none focus:ring-1 focus:ring-purple-500" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-300 mb-1">Archivo de Código</label>
                  <input type="text" id="sol-file" required value="${ch.defaultFile}" class="w-full px-3 py-2 bg-[#090D16] border border-[#30363D] rounded-lg text-xs font-code text-white focus:outline-none focus:ring-1 focus:ring-purple-500" />
                </div>
              </div>

              <div>
                <div class="flex items-center justify-between mb-1">
                  <label class="block text-xs font-medium text-gray-300">Código Fuente de la Solución (Script Plano)</label>
                  <span class="text-[11px] text-gray-500 font-code">Python / JavaScript</span>
                </div>
                <textarea id="sol-code" rows="11" required class="w-full p-4 bg-[#090D16] border border-[#30363D] rounded-lg font-code text-xs text-gray-200 focus:outline-none focus:ring-1 focus:ring-purple-500 leading-relaxed">${ch.starterCode}</textarea>
              </div>

              <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Descripción de la Solución</label>
                <input type="text" id="sol-desc" required value="Solución validada para el desafío de ${ch.company}" class="w-full px-3 py-2 bg-[#090D16] border border-[#30363D] rounded-lg text-xs text-white focus:outline-none focus:ring-1 focus:ring-purple-500" />
              </div>

              <div class="flex items-center justify-between pt-3 border-t border-[#30363D]">
                <span class="text-xs text-gray-400">Se guardará automáticamente en <strong>Mis Soluciones</strong>.</span>
                <div class="flex gap-2">
                  <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs text-gray-400 hover:text-white bg-[#161B22] rounded-lg">Cancelar</button>
                  <button type="submit" class="px-5 py-2 text-xs font-bold text-white bg-purple-600 hover:bg-purple-500 rounded-lg shadow-lg shadow-purple-900/40">
                    Enviar y Crear Repositorio GitHub
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function loadHelloWorldTemplate() {
      const codeArea = document.getElementById('sol-code');
      const fileInput = document.getElementById('sol-file');
      fileInput.value = 'hola_mundo.js';
      codeArea.value = `// ==============================================================
// Script "Hola Mundo" interactivo para NexusSolve
// Desarrollado por: ${state.currentUser.username}
// ==============================================================

function holaMundo(nombre = "${state.currentUser.username}") {
  const saludo = \`¡Hola Mundo desde NexusSolve! Código entregado por \${nombre}.\`;
  console.log(saludo);
  console.log("Fecha de ejecución: " + new Date().toISOString());
  return { status: 200, success: true, autor: nombre };
}

holaMundo();
`;
    }

    // ==========================================
    // 11. MODAL VISOR ESTILO GITHUB REPOSITORIO
    // ==========================================
    function renderRepoViewerModal() {
      const sol = state.selectedSolution;
      if (!sol) return '';
      const ch = state.challenges.find(c => c.id === sol.challengeId);
      const lines = sol.code.split('\n');

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/85 backdrop-blur-md overflow-y-auto">
          <div class="relative w-full max-w-5xl bg-[#0D1117] border border-[#30363D] rounded-xl shadow-2xl text-gray-200 overflow-hidden my-4">
            
            <!-- GitHub Header -->
            <div class="bg-[#161B22] border-b border-[#30363D] px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
              <div class="flex items-center gap-2 text-sm font-semibold truncate">
                <span class="text-gray-400">${sol.username}</span>
                <span class="text-gray-500">/</span>
                <span class="text-purple-400 font-bold truncate">${sol.repoName.split('/')[1] || sol.repoName}</span>
                <span class="text-[11px] font-medium text-gray-400 border border-[#30363D] px-2 py-0.5 rounded-full ml-1">Public</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs bg-[#21262D] px-2.5 py-1 rounded border border-[#30363D] text-gray-300">★ Star 8</span>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1">✕</button>
              </div>
            </div>

            <!-- Contexto del Reto -->
            <div class="bg-[#090D16] border-b border-[#30363D] px-4 sm:px-6 py-2 text-xs flex items-center justify-between">
              <span class="text-gray-400">Reto: <strong class="text-white">${ch ? ch.title : 'Desafío'}</strong> · <span class="text-purple-400">${ch ? ch.company : ''}</span></span>
              <span class="text-emerald-400 font-code font-bold">$${ch ? ch.reward.toLocaleString('en-US') : 0} USD</span>
            </div>

            <!-- Subheader GitHub -->
            <div class="px-4 sm:px-6 py-3 bg-[#0D1117] flex items-center justify-between border-b border-[#30363D] text-xs">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 bg-[#21262D] border border-[#30363D] rounded font-semibold text-gray-200">🌿 main</span>
                <span class="text-gray-400">1 rama · 1 commit</span>
              </div>
              <div class="flex gap-2">
                <button onclick="runCodeInModal('${sol.id}')" class="px-3 py-1.5 font-bold text-white bg-purple-600 hover:bg-purple-500 rounded text-xs shadow">
                  ▶ Ejecutar Script
                </button>
                <button onclick="copyCodeContent()" class="px-3 py-1.5 bg-[#21262D] hover:bg-[#30363D] border border-[#30363D] rounded text-gray-300 text-xs">
                  Copiar Código
                </button>
              </div>
            </div>

            <!-- Último Commit Bar -->
            <div class="mx-4 sm:mx-6 my-3 p-3 bg-[#161B22] border border-[#30363D] rounded-lg flex items-center justify-between text-xs text-gray-400 font-code">
              <div class="truncate">
                <strong class="text-white">${sol.username}</strong> ${sol.commitMessage || 'feat: Entrega de solución'}
              </div>
              <span class="text-purple-400 font-bold shrink-0">${sol.commitHash || 'a8f39c2'}</span>
            </div>

            <!-- Contenedor de Código con Cabecera y Líneas -->
            <div class="p-4 sm:p-6 space-y-4">
              <div class="border border-[#30363D] rounded-lg overflow-hidden bg-[#0D1117]">
                <!-- Cabecera de Archivo Estilo GitHub -->
                <div class="bg-[#161B22] border-b border-[#30363D] px-4 py-2 flex items-center justify-between text-xs text-gray-400 font-code">
                  <div class="flex items-center gap-2">
                    <span class="text-purple-400">📄</span>
                    <strong class="text-white">${sol.fileName}</strong>
                    <span>·</span>
                    <span>${lines.length} líneas</span>
                  </div>
                  <span class="uppercase text-gray-500">${sol.language}</span>
                </div>

                <!-- Líneas de Código con Números en Margen -->
                <div class="p-4 text-xs font-code overflow-x-auto bg-[#0D1117] leading-relaxed max-h-96">
                  <table class="w-full border-collapse">
                    <tbody>
                      ${lines.map((line, idx) => `
                        <tr class="hover:bg-[#161B22]/60">
                          <td class="text-right pr-4 text-gray-600 select-none w-10 text-[11px] align-top">${idx + 1}</td>
                          <td class="text-gray-200 whitespace-pre">${highlightSyntax(line)}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Terminal Interactiva de Ejecución -->
              <div id="repo-terminal" class="hidden border border-[#30363D] rounded-lg bg-[#090D16] overflow-hidden">
                <div class="bg-[#161B22] px-4 py-2 border-b border-[#30363D] text-xs font-code text-gray-300 flex items-center justify-between">
                  <span>💻 Terminal Sandbox de Ejecución</span>
                  <button onclick="document.getElementById('repo-terminal').classList.add('hidden')" class="text-gray-400 hover:text-white">✕</button>
                </div>
                <pre id="repo-terminal-output" class="p-4 text-xs font-code text-emerald-400 whitespace-pre-wrap leading-relaxed max-h-40 overflow-y-auto"></pre>
              </div>
            </div>

            <div class="bg-[#161B22] border-t border-[#30363D] px-6 py-3 flex items-center justify-between text-xs text-gray-400">
              <span>Repositorio sincronizado localmente</span>
              <button onclick="closeModal()" class="px-4 py-1.5 bg-[#21262D] hover:bg-[#30363D] rounded text-white">Cerrar Visor</button>
            </div>
          </div>
        </div>
      `;
    }

    function highlightSyntax(line) {
      if (line.trim().startsWith('//') || line.trim().startsWith('#')) {
        return `<span class="text-gray-500 italic">${escapeHtml(line)}</span>`;
      }
      return escapeHtml(line)
        .replace(/(def|class|function|return|import|from|const|let|var|if|else|while|for)/g, '<span class="text-[#FF7B72] font-bold">$1</span>')
        .replace(/(".*?"|'.*?'|`.*?`)/g, '<span class="text-[#A5D6FF]">$1</span>')
        .replace(/(print|console\.log|Math|Date|JSON)/g, '<span class="text-[#79C0FF]">$1</span>');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function copyCodeContent() {
      if (state.selectedSolution) {
        navigator.clipboard.writeText(state.selectedSolution.code);
        showToast('success', 'Código copiado', 'Contenido copiado al portapapeles.');
      }
    }

    function runCodeInModal(solId) {
      const term = document.getElementById('repo-terminal');
      const termOut = document.getElementById('repo-terminal-output');
      if (!term || !termOut) return;

      term.classList.remove('hidden');
      termOut.textContent = '$ Ejecutando script en entorno sandbox...\n';

      setTimeout(() => {
        const sol = state.selectedSolution;
        const output = sol.executionOutput || `[OK] Proceso terminado con código 0.\nSalida:\n${sol.code.split('\n').filter(l => l.includes('console.log') || l.includes('print')).join('\n')}`;
        termOut.textContent += `[OK] Tiempo: 28ms\n----------------------------------------\n${output}`;
      }, 500);
    }

    // ==========================================
    // 12. FOOTER
    // ==========================================
    function renderFooter() {
      return `
        <footer class="w-full border-t border-[#30363D] bg-[#0D1117] py-6 px-4 text-xs text-gray-500 mt-auto">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <strong class="text-gray-300">NexusSolve Code Hub</strong> · Crowdsourcing y Repositorios de Código
            </div>
            <div class="flex items-center gap-4">
              <button onclick="resetData()" class="text-gray-400 hover:text-purple-300">Restablecer 13 retos y datos</button>
              <span>·</span>
              <span class="font-code text-purple-400">Usuario activo: ${state.currentUser.username}</span>
            </div>
          </div>
        </footer>
      `;
    }

    // ==========================================
    // 13. CONTROLADORES DE EVENTOS Y RUTAS
    // ==========================================
    function switchTab(tab) {
      state.activeTab = tab;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function logout() {
      state.currentUser = null;
      setCurrentSession(null);
      showToast('info', 'Sesión cerrada', 'Has salido de tu cuenta.');
      renderApp();
    }

    function openSubmitModal(challengeId) {
      state.selectedChallenge = state.challenges.find(c => c.id === challengeId);
      state.activeModal = 'submit';
      renderApp();
    }

    function openRepoViewer(solutionId) {
      state.selectedSolution = state.solutions.find(s => s.id === solutionId);
      state.activeModal = 'repo-viewer';
      renderApp();
    }

    function closeModal() {
      state.activeModal = null;
      state.selectedChallenge = null;
      state.selectedSolution = null;
      renderApp();
    }

    function setIndustryFilter(ind) {
      state.filterIndustry = ind;
      renderApp();
    }

    function resetData() {
      state.challenges = CHALLENGES;
      state.solutions = INITIAL_SOLUTIONS;
      state.registeredUsers = DEFAULT_USERS;
      saveSolutions(INITIAL_SOLUTIONS);
      saveRegisteredUsers(DEFAULT_USERS);
      showToast('success', 'Datos restablecidos', 'Se han restaurado los 13 retos y las soluciones originales de Angelo2008.');
      renderApp();
    }

    function bindGlobalEvents() {
      // Búsqueda en catálogo
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.oninput = (e) => {
          state.searchQuery = e.target.value;
          // Render solo de la sección de retos para no perder foco
          const container = document.querySelector('main');
          if (container && state.activeTab === 'explorar') {
            container.innerHTML = renderExploreChallenges();
            const newSearch = document.getElementById('search-input');
            if (newSearch) {
              newSearch.focus();
              newSearch.setSelectionRange(newSearch.value.length, newSearch.value.length);
              bindGlobalEvents();
            }
          }
        };
      }

      // Envío de Solución en el Modal
      const solForm = document.getElementById('solution-form');
      if (solForm) {
        solForm.onsubmit = (e) => {
          e.preventDefault();
          const repo = document.getElementById('sol-repo').value.trim();
          const file = document.getElementById('sol-file').value.trim();
          const code = document.getElementById('sol-code').value;
          const desc = document.getElementById('sol-desc').value.trim();

          const newSol = {
            id: 'sol-' + Date.now(),
            challengeId: state.selectedChallenge.id,
            username: state.currentUser.username,
            repoName: repo,
            fileName: file,
            language: file.endsWith('.js') ? 'javascript' : 'python',
            code: code,
            description: desc,
            commitMessage: 'feat: Entrega de código validado para reto ' + state.selectedChallenge.number,
            commitHash: Math.random().toString(16).substring(2, 9),
            submittedAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
            status: 'en_revision',
            executionOutput: `[OK] Archivo ${file} compilado y validado en sandbox.\nSalida de prueba:\n${code.split('\n').filter(l => l.includes('console.log') || l.includes('print')).join('\n') || 'Proceso finalizado con éxito.'}`
          };

          // Guardar y agregar a Mis Soluciones
          state.solutions.unshift(newSol);
          saveSolutions(state.solutions);

          showToast('success', '¡Solución Enviada y Repositorio Creado!', `Se ha registrado ${repo} en Mis Soluciones.`);

          // Regla clave: Mover a Mis Soluciones y abrir visor
          state.activeTab = 'mis-soluciones';
          state.activeModal = 'repo-viewer';
          state.selectedSolution = newSol;
          renderApp();
        };
      }
    }

    // Inicializar aplicación
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
    // Fallback inmediato si DOMContentLoaded ya ocurrió
    renderApp();
  </script>
</body>
